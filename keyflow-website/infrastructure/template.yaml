AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Keyflow waitlist API

Globals:
  Function:
    Timeout: 10
    Runtime: nodejs20.x
    MemorySize: 256

Parameters:
  FromEmail:
    Type: String
    Default: hello@keyflowae.com
  NotifyEmail:
    Type: String
    Default: a.alshaqra@keyflowae.com

Resources:
  WaitlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: keyflow-waitlist
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
        - AttributeName: created_at
          KeyType: RANGE

  WaitlistApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - "https://keyflowae.com"
          - "http://localhost:3000"
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  WaitlistFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/waitlist/
      Handler: index.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref WaitlistTable
          FROM_EMAIL: !Ref FromEmail
          NOTIFY_EMAIL: !Ref NotifyEmail
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WaitlistTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
      Events:
        PostWaitlist:
          Type: HttpApi
          Properties:
            ApiId: !Ref WaitlistApi
            Path: /waitlist
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - index.ts

Outputs:
  ApiUrl:
    Description: Waitlist API endpoint
    Value: !Sub "https://${WaitlistApi}.execute-api.${AWS::Region}.amazonaws.com/prod/waitlist"
